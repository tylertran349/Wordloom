<!doctype html>
<html lang="en" data-theme="light" data-accent="jade">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Google Translate's free TTS endpoint returns 404 when a referer is sent. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta
      name="description"
      content="Wordloom is a local-first vocabulary trainer with CEFR levels, translation practice, and spaced repetition."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M20 44V22h6l6 12 6-12h6v22h-5V31l-5 10h-4l-5-10v13z' fill='%23fffdfa'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('wordloom.settings.v1') || '{}');
        var theme =
          saved.theme === 'dark' || saved.theme === 'light'
            ? saved.theme
            : saved.theme === 'system' &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', theme === 'dark' ? '#101512' : '#f6f4ef');
        }
        if (saved.accent) document.documentElement.dataset.accent = saved.accent;
        if (saved.fontScale) {
          document.documentElement.style.setProperty('--font-scale', String(saved.fontScale));
        }
        if (saved.reduceMotion) {
          document.documentElement.classList.add('reduce-motion');
        }
      } catch (error) {}
    </script>
    <title>Wordloom · Words that stick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
